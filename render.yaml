services:
  - type: web
    name: agent-hub-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: JIRA_DOMAIN
        sync: false
      - key: JIRA_EMAIL
        sync: false
      - key: JIRA_API_TOKEN
        sync: false
      - key: JIRA_PROJECT_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

  - type: web
    name: agent-hub-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      # Set this manually after the backend service deploys, to its full
      # URL including the scheme (e.g. https://agent-hub-backend-xxxx.onrender.com).
      # Render's fromService/property:host returns a bare internal hostname
      # with no https:// prefix, which breaks outbound requests - confirmed
      # the hard way, don't reintroduce it here.
      - key: API_URL
        sync: false
